# Trọng số trụ cột cho DBI (xem docs/methodology.md mục 3)
# Khóa là mã trụ cột 1–6. Tổng không cần đúng bằng 1, code tự chuẩn hóa lại.
scenarios:
  base:
    label: "Cơ sở · 6 trụ cột bằng nhau"
    weights: {1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1}
  S1:
    label: "S1 · Nhấn Khách hàng"
    weights: {1: 0.25, 2: 0.15, 3: 0.15, 4: 0.15, 5: 0.15, 6: 0.15}
  S2:
    label: "S2 · Nhấn Công nghệ"
    weights: {1: 0.15, 2: 0.15, 3: 0.25, 4: 0.15, 5: 0.15, 6: 0.15}
  S3:
    label: "S3 · Nhấn Dữ liệu"
    weights: {1: 0.15, 2: 0.15, 3: 0.15, 4: 0.15, 5: 0.15, 6: 0.25}

# Mô phỏng trọng số ngẫu nhiên (tùy chọn trong methodology)
dirichlet:
  runs: 1000
  seed: 42
